# dsh-rock-app bundle patch: the Rock (ConnectorClient) layer over the dsh web
# surface. Applied after dsh-web-app; rows here address base/web rows by id.
#
# The Rock composition is thin-relay: a `rock` agent preset whose only tool is
# the codex delegation tool, so the parent agent delegates to a native Codex
# session instead of thinking itself. The three Rock plugins are cloud-facing
# and are safe to boot standalone — `cloud-llm-adapter` and `seagull-identity`
# stay disabled until their deployment env is present, and `gateway-reporter`
# buffers session events to a local JSONL file when the gateway is unreachable.

# ── Rock console shell: strip the agent-chat surface, keep the assistant ────
# Rock is an ops console with one interactive exception (D-035): the assistant
# session. ui-chat/ui-conversation/ui-approval/ui-input-trigger stay enabled for
# that session; the workspace/session browser, agent teams/subagents, automation
# (schedule), and "browse more plugins" More menu remain disabled. Host session
# infra (session-query / session-stats / session-persistence) stays mounted so
# rock-observability keeps reading local session data.

# agent chat + session dialog (assistant session kept, D-035 / REQ-010)
- id: ui-model-selection
  disabled: true
- id: ui-commands
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-reference
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: ui-user-questions
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-attachment
  disabled: true
- id: ui-tool
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-jobs
  disabled: true
- id: message-quotes
  disabled: true
- id: deliverable-file-references
  disabled: true
- id: workspace-changes
  disabled: true
# secret masking rides ui-conversation's `uiConversation`; kept with the session.

# workspace / session browsing
# NOTE: ui-workspace stays mounted — it provides the `uiWorkspace` service the
# sidebar shell injects (`startSession`). The workspace/session browser surface
# itself is removed separately (REQ-006 follow-up), not by disabling the row.
- id: ui-sidebar-files
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: ui-sidebar-documentpreview
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: ui-file-actions
  disabled: true
- id: open-in-app
  disabled: true

# agent teams / subagents (delegation is internal, not a user surface)
- id: ui-agent-team
  disabled: true
- id: ui-subagent
  disabled: true

# automation (schedule) + browse-more-plugins (More menu)
- id: ui-schedule
  disabled: true
- id: entry-customization
  disabled: true

# The console has no chat surface: hide the sidebar's New Session affordances
# (the New Session row and the brand-as-New-Session shortcut).
- id: ui-sidebar
  config:
    showNewSession: false

- insert:
    # ── codex subagent provider + global delegation tool ──
    # Each delegation spawns one unattended Codex thread in the parent workspace.
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: codex
        permissionMode: approve-for-me
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        maxDepth: provider-managed

    # ── plugin① cloud-llm-adapter: LLM route per provider ──
    # Rock-relayed route: connector-key auth + `/v1/bots/{agentId}` URL; the
    # Seagull LLM Proxy resolves the agent from the URL + connector key, so
    # skill injection targets the right bot (no shared agent API key).
    - id: llm-cloud
      name: '@rock/cloud-llm-adapter'
      config:
        providers:
          seagull-cloud:
            baseUrl: !!js "process.env.SEAGULL_CLOUD_BASE_URL || 'http://127.0.0.1:3000'"
            name: Seagull Cloud
            defaultModel: seagull-relay
            relay: true

    # ── plugin④ rock-llm-relay: loopback LLM relay for external tools (D-034) ──
    # External tools (Codex) point base_url at http://127.0.0.1:4090/v1/bots/{agentBotId};
    # the relay injects the connector key (from rock-onboarding) and forwards to the cloud Proxy.
    - id: llm-relay
      name: '@rock/rock-llm-relay'
      config:
        port: 4090
        cloudBaseUrl: !!js "process.env.SEAGULL_GATEWAY_URL || 'http://127.0.0.1:3100'"
        connectorClientId: f80ad5b86b76800334741870

    # ── rock-onboarding: first-run connector-key entry (REQ-013) ──
    - id: rock-onboarding
      name: '@rock/rock-onboarding'

    # ── plugin② seagull-identity: seat-claim sync + tool binding ──
    # Always mounted; syncs claims using the connector-key identity from
    # rock-onboarding (falls back to the env config below when no key yet).
    - id: seagull-identity
      name: '@rock/seagull-identity'
      config:
        gatewayUrl: !!js "(process.env.SEAGULL_GATEWAY_URL || 'http://127.0.0.1:3100') + '/v1/connectors/claims'"
        employeeId: !!js "process.env.SEAGULL_EMPLOYEE_ID || 'employee-a'"
        claimFile: !!js "process.env.ROCK_CLAIM_FILE || '.rock/claims.json'"
        bindings:
          agent-bot-C: codex

    # ── plugin③ gateway-reporter: session events outbound to the gateway ──
    # Always mounted; without a gateway it buffers to ROCK_BUFFER_PATH so the
    # relayed events stay observable locally.
    - id: gateway-reporter
      name: '@rock/gateway-reporter'
      config:
        gatewayUrl: !!js "(process.env.SEAGULL_GATEWAY_URL || 'http://127.0.0.1:3100') + '/v1/connectors/report'"
        connectorClientId: !!js "process.env.ROCK_CONNECTOR_CLIENT_ID || 'rock-employee-a'"
        employeeId: !!js "process.env.SEAGULL_EMPLOYEE_ID || 'employee-a'"
        bufferPath: !!js "process.env.ROCK_BUFFER_PATH || '.rock/events.jsonl'"

    # ── plugin⑤ rock-bot-manager: local bot registry (custom bots) ──
    # Always mounted: the local workbench owns its custom bots independent of
    # the Seagull seat-claim model.
    - id: rock-bot-manager
      name: '@rock/rock-bot-manager'
      config:
        storePath: !!js "process.env.ROCK_BOT_STORE || '.rock/bots.json'"
        tasksUrl: !!js "(process.env.SEAGULL_GATEWAY_URL || 'http://127.0.0.1:3100') + '/v1/connectors/gateway/tasks'"
        employeeId: !!js "process.env.SEAGULL_EMPLOYEE_ID || 'employee-a'"

    # ── plugin⑥ rock-observability: local session turns/steps/tokens fold ──
    # Always mounted: the workbench dashboard reads ctx.rockObservability.
    - id: rock-observability
      name: '@rock/rock-observability'

    # ── rock-console: default landing panel (the console has no chat) ──
    - id: rock-console
      name: '@rock/rock-console'

    # ── rock-tool-inventory: read-only installed-tool probes ──
    - id: rock-tool-inventory
      name: '@rock/rock-tool-inventory'

    # ── rock-tasks: overview + task-management panels over the task queue ──
    - id: rock-tasks
      name: '@rock/rock-tasks'
      config:
        tasksUrl: !!js "(process.env.SEAGULL_GATEWAY_URL || 'http://127.0.0.1:3100') + '/v1/connectors/gateway/tasks'"
        employeeId: !!js "process.env.SEAGULL_EMPLOYEE_ID || 'employee-a'"
        workRecordsPath: !!js "process.env.ROCK_WORK_RECORDS_PATH || '.rock/task-work-records.jsonl'"

# ── assistant preset: the onboarding guide runs its own loop (D-035) ──
- insert:
    - id: preset-assistant
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: assistant
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the new employee's onboarding assistant (专属助理). Guide them
                through workstation setup. Follow the system-injected onboarding skill
                (`rock-onboarding-tool-install`) for tool detection and installation:
                detect codex/pi, list what is missing, ask once for consent, then install
                each missing tool through the shell tool and report its outcome. Do not
                delegate to a subagent; run shell commands directly.
              complete: true
              includeRuntimeContext: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

# ── thin-relay preset: the Rock agent delegates, it does not think ──
- insert:
    - id: preset-rock
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rock
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the thin-relay delegator for an agent bot seat. Do not solve the
                task yourself. Delegate it to the subagent_codex tool and return its result
                verbatim. Your only tool is subagent_codex.
              complete: true
              includeRuntimeContext: false
